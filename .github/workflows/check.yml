name: Check generated content

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generated blocks match data/profile.json
        run: python3 tools/build.py --check
      - name: JSON is valid
        run: |
          python3 -m json.tool data/profile.json > /dev/null
          python3 -m json.tool assets/persona.json > /dev/null
