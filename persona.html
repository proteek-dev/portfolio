<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Persona // Proteek</title>

  <link rel="stylesheet" href="assets/css/base.css" />
  <link rel="stylesheet" href="assets/css/mode.css" />

  <style>
    /* ── Persona Layout ─────────────────────────────────────── */
    .persona-layout {
      display: grid;
      grid-template-columns: 300px 1fr;
      gap: 18px;
      height: calc(100vh - 130px);
      min-height: 520px;
    }

    /* ── Identity Panel ─────────────────────────────────────── */
    .identity-panel {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .orb-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .orb {
      width: 96px;
      height: 96px;
      border-radius: 999px;
      position: relative;
      background: radial-gradient(circle at 35% 32%,
        rgba(230, 170, 255, 0.95),
        rgba(160, 100, 255, 0.70) 45%,
        rgba(80,  50, 180, 0.45) 80%
      );
      box-shadow:
        0 0 36px rgba(180, 120, 255, 0.55),
        0 0 72px rgba(130, 170, 255, 0.22),
        inset 0 0 18px rgba(255, 255, 255, 0.08);
      animation: orbIdle 3.5s ease-in-out infinite;
      transition: background 0.4s ease;
    }

    @keyframes orbIdle {
      0%, 100% { transform: scale(1);    box-shadow: 0 0 36px rgba(180,120,255,.55), 0 0 72px rgba(130,170,255,.22); }
      50%       { transform: scale(1.05); box-shadow: 0 0 52px rgba(180,120,255,.75), 0 0 100px rgba(130,170,255,.30); }
    }

    .orb.listening {
      animation: orbListen 0.65s ease-in-out infinite alternate;
      background: radial-gradient(circle at 35% 32%,
        rgba(160, 255, 220, 0.95),
        rgba(60,  200, 160, 0.70) 45%,
        rgba(20,  100, 80,  0.40) 80%
      );
    }
    @keyframes orbListen {
      from { transform: scale(1.00); box-shadow: 0 0 36px rgba(120,255,210,.60); }
      to   { transform: scale(1.10); box-shadow: 0 0 70px rgba(120,255,210,.90), 0 0 120px rgba(80,200,160,.30); }
    }

    .orb.speaking {
      animation: orbSpeak 0.45s ease-in-out infinite alternate;
    }
    @keyframes orbSpeak {
      from { transform: scale(1.00); box-shadow: 0 0 40px rgba(180,120,255,.65); }
      to   { transform: scale(1.07); box-shadow: 0 0 72px rgba(200,140,255,.95), 0 0 130px rgba(130,170,255,.35); }
    }

    .identity-name {
      font-size: 20px;
      margin: 0 0 2px;
      text-align: center;
    }
    .identity-role {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.5px;
      text-align: center;
      margin: 0 0 10px;
    }
    .status-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--muted);
    }
    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: rgba(120, 255, 210, 0.85);
      box-shadow: 0 0 7px rgba(120, 255, 210, 0.60);
      animation: dotPulse 2.2s ease-in-out infinite;
    }
    .status-dot.listening { background: rgba(120,255,210,.9);  animation: dotFast .55s ease-in-out infinite alternate; }
    .status-dot.speaking  { background: rgba(200,140,255,.9);  animation: dotFast .40s ease-in-out infinite alternate; box-shadow: 0 0 7px rgba(200,140,255,.60); }
    @keyframes dotPulse { 0%,100%{opacity:1} 50%{opacity:.40} }
    @keyframes dotFast  { from{opacity:1} to{opacity:.25} }

    /* ── Suggestions ──────────────────────────────────────────── */
    .suggestions-wrap {
      flex: 1;
    }
    .suggestions-label {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 1.5px;
      color: rgba(255,255,255,.40);
      margin-bottom: 10px;
    }
    .suggestions-list {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }
    .suggest-btn {
      text-align: left;
      cursor: pointer;
      padding: 9px 13px;
      border-radius: 13px;
      border: 1px solid rgba(180,120,255,.18);
      background: rgba(180,120,255,.07);
      color: rgba(255,255,255,.80);
      font-family: var(--sans);
      font-size: 12.5px;
      line-height: 1.4;
      transition: all .17s ease;
    }
    .suggest-btn:hover {
      background: rgba(180,120,255,.16);
      border-color: rgba(180,120,255,.38);
      transform: translateX(3px);
      color: rgba(255,255,255,.95);
    }

    /* ── Chat Panel ─────────────────────────────────────────── */
    .chat-panel {
      display: flex;
      flex-direction: column;
      border-radius: var(--radius);
      border: 1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.025);
      backdrop-filter: blur(6px);
      overflow: hidden;
    }

    .messages-area {
      flex: 1;
      overflow-y: auto;
      padding: 22px 20px 14px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scroll-behavior: smooth;
    }
    .messages-area::-webkit-scrollbar        { width: 3px; }
    .messages-area::-webkit-scrollbar-track  { background: transparent; }
    .messages-area::-webkit-scrollbar-thumb  { background: rgba(255,255,255,.13); border-radius: 999px; }

    .message {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      max-width: 88%;
    }
    .message.user { flex-direction: row-reverse; align-self: flex-end; }
    .message.ai   { align-self: flex-start; }

    .msg-av {
      width: 28px;
      height: 28px;
      border-radius: 999px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
    }
    .msg-av.ai-av {
      background: radial-gradient(circle at 35% 35%, rgba(220,160,255,.9), rgba(130,100,255,.6));
      box-shadow: 0 0 10px rgba(180,120,255,.40);
    }
    .msg-av.user-av {
      background: rgba(255,255,255,.10);
      border: 1px solid rgba(255,255,255,.16);
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: .5px;
      color: rgba(255,255,255,.60);
    }

    .msg-bubble {
      padding: 11px 15px;
      line-height: 1.68;
      font-size: 13.5px;
    }
    .message.ai   .msg-bubble {
      background: rgba(180,120,255,.09);
      border: 1px solid rgba(180,120,255,.17);
      border-radius: 4px 16px 16px 16px;
      color: rgba(255,255,255,.88);
    }
    .message.user .msg-bubble {
      background: rgba(130,170,255,.10);
      border: 1px solid rgba(130,170,255,.18);
      border-radius: 16px 4px 16px 16px;
      color: rgba(255,255,255,.88);
    }

    /* Typing dots */
    .typing-dots {
      display: flex;
      gap: 5px;
      align-items: center;
      padding: 3px 2px;
    }
    .typing-dots span {
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: rgba(180,120,255,.65);
      animation: tdot 1.3s ease-in-out infinite;
    }
    .typing-dots span:nth-child(2) { animation-delay: .22s; }
    .typing-dots span:nth-child(3) { animation-delay: .44s; }
    @keyframes tdot {
      0%,60%,100% { transform: translateY(0);    opacity: .50; }
      30%          { transform: translateY(-6px); opacity: 1;   }
    }

    /* ── Input Row ──────────────────────────────────────────── */
    .input-row {
      display: flex;
      gap: 8px;
      align-items: center;
      padding: 13px 15px 11px;
      border-top: 1px solid rgba(255,255,255,.07);
      background: rgba(0,0,0,.18);
    }
    #chatInput {
      flex: 1;
      background: rgba(255,255,255,.055);
      border: 1px solid rgba(255,255,255,.13);
      border-radius: 13px;
      padding: 11px 15px;
      color: rgba(255,255,255,.92);
      font-family: var(--sans);
      font-size: 13.5px;
      outline: none;
      transition: border-color .18s;
    }
    #chatInput:focus        { border-color: rgba(180,120,255,.45); }
    #chatInput::placeholder { color: rgba(255,255,255,.32); }

    .icon-btn {
      width: 44px;
      height: 44px;
      border-radius: 13px;
      border: 1px solid rgba(255,255,255,.13);
      background: rgba(255,255,255,.06);
      color: rgba(255,255,255,.65);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 17px;
      flex-shrink: 0;
      transition: all .18s;
    }
    .icon-btn:hover:not(:disabled) {
      background: rgba(255,255,255,.12);
      border-color: rgba(255,255,255,.22);
    }
    .icon-btn:disabled { opacity: .35; cursor: not-allowed; }

    .icon-btn.mic.active {
      background: rgba(120,255,210,.14);
      border-color: rgba(120,255,210,.38);
      color: rgba(120,255,210,.90);
      animation: micGlow .55s ease-in-out infinite alternate;
    }
    @keyframes micGlow {
      from { box-shadow: 0 0 0   rgba(120,255,210,0); }
      to   { box-shadow: 0 0 16px rgba(120,255,210,.45); }
    }

    .icon-btn.send {
      background: rgba(180,120,255,.13);
      border-color: rgba(180,120,255,.28);
      color: rgba(180,120,255,.88);
    }
    .icon-btn.send:hover {
      background: rgba(180,120,255,.22);
      border-color: rgba(180,120,255,.48);
      color: rgba(200,150,255,.95);
    }

    .voice-hint {
      text-align: center;
      padding: 4px 0 6px;
      font-family: var(--mono);
      font-size: 10.5px;
      color: rgba(255,255,255,.30);
      transition: color .2s;
    }
    .voice-hint.active { color: rgba(120,255,210,.65); }

    /* ── Responsive ─────────────────────────────────────────── */
    @media (max-width: 780px) {
      .persona-layout {
        grid-template-columns: 1fr;
        height: auto;
      }
      .identity-panel {
        flex-direction: row;
        flex-wrap: wrap;
        align-items: flex-start;
        gap: 14px;
      }
      .orb-wrap { align-items: flex-start; flex-direction: row; gap: 14px; }
      .orb { width: 64px; height: 64px; }
      .identity-name { text-align: left; font-size: 17px; }
      .identity-role { text-align: left; }
      .status-row { justify-content: flex-start; }
      .suggestions-wrap { width: 100%; }
      .chat-panel { height: 62vh; }
    }
  </style>
</head>
<body class="theme theme-persona" data-mode="persona">
  <div class="bg-aurora"></div>
  <div class="bg-noise"></div>
  <div class="vignette"></div>
  <div class="cursor-glow" id="cursorGlow"></div>
  <canvas id="starfield" class="starfield" aria-hidden="true"></canvas>

  <header class="topbar">
    <a class="brand" href="index.html" aria-label="Back to portal">
      <span class="brand-dot"></span>
      <span class="brand-title">PROTEEK <span class="muted">//</span> PERSONA</span>
      <span class="brand-sub">AI layer</span>
    </a>
    <div class="top-actions">
      <a class="btn" href="looker.html">Looker</a>
      <a class="btn" href="recruiter.html">Recruiter</a>
      <a class="btn" href="developer.html">Developer</a>
    </div>
  </header>

  <main class="page">
    <div class="persona-layout">

      <!-- ── Left: Identity ──────────────────────────────────── -->
      <aside class="identity-panel">
        <div class="orb-wrap">
          <div class="orb" id="orb" aria-hidden="true"></div>
          <div>
            <h2 class="identity-name">Proteek Sanyal</h2>
            <p class="identity-role">Data Analyst &amp; ML Engineer</p>
            <div class="status-row">
              <div class="status-dot" id="statusDot"></div>
              <span id="statusLabel">Online</span>
            </div>
          </div>
        </div>

        <div class="suggestions-wrap">
          <p class="suggestions-label">TRY ASKING</p>
          <div class="suggestions-list" id="suggestList"></div>
        </div>
      </aside>

      <!-- ── Right: Chat ─────────────────────────────────────── -->
      <div class="chat-panel">
        <div class="messages-area" id="messages" role="log" aria-live="polite" aria-label="Conversation"></div>

        <div class="input-row">
          <input
            type="text"
            id="chatInput"
            placeholder="Ask me anything about Proteek…"
            autocomplete="off"
            aria-label="Chat input"
          />
          <button class="icon-btn mic" id="micBtn" title="Hold to speak" aria-label="Toggle voice input">🎤</button>
          <button class="icon-btn send" id="sendBtn" title="Send" aria-label="Send message">↑</button>
        </div>
        <p class="voice-hint" id="voiceHint">🎤 click mic to speak &nbsp;·&nbsp; ↑ or Enter to send</p>
      </div>

    </div>
  </main>

  <script src="assets/js/app.js"></script>
  <script>
  (async () => {
    /* ── Load persona data ───────────────────────────────────── */
    let P;
    try {
      const r = await fetch('assets/persona.json');
      if (!r.ok) throw new Error(r.status);
      P = await r.json();
    } catch (e) {
      console.error('persona.json failed to load:', e);
      document.getElementById('messages').innerHTML =
        '<p style="color:rgba(255,80,80,.8);padding:20px;">Could not load persona data. Make sure assets/persona.json exists.</p>';
      return;
    }

    /* ── Elements ────────────────────────────────────────────── */
    const messagesEl  = document.getElementById('messages');
    const chatInput   = document.getElementById('chatInput');
    const sendBtn     = document.getElementById('sendBtn');
    const micBtn      = document.getElementById('micBtn');
    const orb         = document.getElementById('orb');
    const statusDot   = document.getElementById('statusDot');
    const statusLabel = document.getElementById('statusLabel');
    const voiceHint   = document.getElementById('voiceHint');
    const suggestList = document.getElementById('suggestList');

    /* ── Suggestion chips ────────────────────────────────────── */
    const SUGGESTIONS = [
      "What are your main skills?",
      "Tell me about your experience",
      "What projects have you built?",
      "Are you open to work?",
      "Where are you based?",
      "How can I contact you?",
      "Tell me about your ML work",
    ];
    SUGGESTIONS.forEach(s => {
      const b = document.createElement('button');
      b.className = 'suggest-btn';
      b.textContent = s;
      b.addEventListener('click', () => { chatInput.value = s; handleSend(); });
      suggestList.appendChild(b);
    });

    /* ── Rule engine ─────────────────────────────────────────── */
    const norm = t =>
      t.toLowerCase().replace(/['']/g, "'").replace(/[^a-z0-9'\s]/g, ' ').replace(/\s+/g, ' ').trim();

    const GREET_WORDS = new Set(['hi', 'hello', 'hey', 'howdy', 'greetings', 'yo', 'sup', 'hiya']);

    function findResponse(raw) {
      const n = norm(raw);
      const words = new Set(n.split(' '));

      // Greeting shortcut (≤4 words and contains a greeting word)
      if (raw.trim().split(/\s+/).length <= 4 && [...words].some(w => GREET_WORDS.has(w))) {
        return pick(P.greeting);
      }

      let best = 0, winner = null;
      for (const qa of P.qa) {
        let score = 0;
        for (const trigger of qa.triggers) {
          const nt = norm(trigger);
          if (n.includes(nt)) {
            score += nt.split(' ').length * 3; // exact phrase match, weighted by length
          } else {
            // partial: count shared tokens
            const tt = new Set(nt.split(' '));
            for (const w of tt) if (words.has(w) && w.length > 3) score += 1;
          }
        }
        if (score > best) { best = score; winner = qa; }
      }

      if (best < 1) return pick(P.fallback);
      const r = winner.response;
      return Array.isArray(r) ? pick(r) : r;
    }

    function pick(arr) {
      return arr[Math.floor(Math.random() * arr.length)];
    }

    /* ── State helpers ───────────────────────────────────────── */
    function setOrbState(state) {
      orb.className       = 'orb' + (state ? ' ' + state : '');
      statusDot.className = 'status-dot' + (state ? ' ' + state : '');
      statusLabel.textContent =
        state === 'listening' ? 'Listening…' :
        state === 'speaking'  ? 'Speaking…'  : 'Online';
    }

    /* ── UI builders ─────────────────────────────────────────── */
    function addMessage(text, role) {
      const wrap   = document.createElement('div');
      wrap.className = `message ${role}`;

      const av     = document.createElement('div');
      av.className = `msg-av ${role === 'ai' ? 'ai-av' : 'user-av'}`;
      av.textContent = role === 'ai' ? '✦' : 'You';

      const bubble = document.createElement('div');
      bubble.className = 'msg-bubble';
      bubble.textContent = text;

      wrap.appendChild(av);
      wrap.appendChild(bubble);
      messagesEl.appendChild(wrap);
      scrollToBottom();
      return wrap;
    }

    function showTyping() {
      const wrap   = document.createElement('div');
      wrap.className = 'message ai';

      const av = document.createElement('div');
      av.className = 'msg-av ai-av';
      av.textContent = '✦';

      const bubble = document.createElement('div');
      bubble.className = 'msg-bubble';

      const dots = document.createElement('div');
      dots.className = 'typing-dots';
      dots.innerHTML = '<span></span><span></span><span></span>';
      bubble.appendChild(dots);

      wrap.appendChild(av);
      wrap.appendChild(bubble);
      messagesEl.appendChild(wrap);
      scrollToBottom();
      return wrap;
    }

    function scrollToBottom() {
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    /* ── TTS ─────────────────────────────────────────────────── */
    const synth = window.speechSynthesis;
    let preferredVoice = null;

    function pickVoice() {
      const voices = synth.getVoices();
      preferredVoice =
        voices.find(v => v.name.includes('Google') && v.lang.startsWith('en')) ||
        voices.find(v => v.lang === 'en-AU') ||
        voices.find(v => v.lang.startsWith('en-')) ||
        null;
    }
    if (synth.onvoiceschanged !== undefined) synth.onvoiceschanged = pickVoice;
    pickVoice();

    function speak(text) {
      return new Promise(resolve => {
        if (!synth) { resolve(); return; }
        synth.cancel();
        const utt = new SpeechSynthesisUtterance(text);
        if (preferredVoice) utt.voice = preferredVoice;
        utt.rate   = 1.0;
        utt.pitch  = 1.0;
        utt.volume = 1.0;
        setOrbState('speaking');
        const done = () => { setOrbState(''); resolve(); };
        utt.onend   = done;
        utt.onerror = done;
        synth.speak(utt);
      });
    }

    /* ── STT ─────────────────────────────────────────────────── */
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition   = null;
    let isListening   = false;

    if (SR) {
      recognition = new SR();
      recognition.lang = 'en-AU';
      recognition.continuous      = false;
      recognition.interimResults  = false;
      recognition.maxAlternatives = 1;

      recognition.onstart = () => {
        isListening = true;
        micBtn.classList.add('active');
        setOrbState('listening');
        voiceHint.textContent = '🎤 Listening — speak now…';
        voiceHint.classList.add('active');
      };
      recognition.onresult = e => {
        const transcript = e.results[0][0].transcript.trim();
        chatInput.value = transcript;
        stopListening();
        setTimeout(handleSend, 200);
      };
      recognition.onend  = stopListening;
      recognition.onerror = ev => {
        stopListening();
        if (ev.error !== 'no-speech') {
          voiceHint.textContent = `Voice error: ${ev.error}`;
        }
      };
    } else {
      micBtn.disabled = true;
      micBtn.title    = 'Voice not supported — try Chrome or Edge';
      voiceHint.textContent = '⚠ Voice input not supported in this browser (try Chrome/Edge)';
    }

    function stopListening() {
      isListening = false;
      micBtn.classList.remove('active');
      if (statusLabel.textContent === 'Listening…') setOrbState('');
      voiceHint.textContent = '🎤 click mic to speak · ↑ or Enter to send';
      voiceHint.classList.remove('active');
    }

    micBtn.addEventListener('click', () => {
      if (!recognition) return;
      if (isListening) {
        recognition.stop();
      } else {
        synth?.cancel();
        recognition.start();
      }
    });

    /* ── Send flow ───────────────────────────────────────────── */
    let busy = false;

    async function handleSend() {
      const text = chatInput.value.trim();
      if (!text || busy) return;
      busy = true;
      chatInput.value = '';

      addMessage(text, 'user');
      const typing = showTyping();

      // brief thinking delay
      await new Promise(r => setTimeout(r, 380 + Math.random() * 520));

      const response = findResponse(text);
      typing.remove();
      addMessage(response, 'ai');
      await speak(response);

      busy = false;
    }

    sendBtn.addEventListener('click', handleSend);
    chatInput.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleSend(); }
    });

    /* ── Boot greeting ───────────────────────────────────────── */
    setTimeout(async () => {
      const greeting = pick(P.greeting);
      addMessage(greeting, 'ai');
      await speak(greeting);
    }, 700);

  })();
  </script>
</body>
</html>
